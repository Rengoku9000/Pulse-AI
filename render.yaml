# render.yaml — PulseGuard AI deployment blueprint
# Uses existing Dockerfiles in backend/ and vector-service/

services:
  # ─────────────────────────────────────────────────────────────
  # SERVICE 1: FastAPI Triage Backend
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: pulseguard-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: VECTOR_SERVICE_URL
        sync: false          # Paste the pulseguard-vector URL after it deploys
      - key: ENV
        value: production
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: FRONTEND_ORIGIN
        sync: false          # Paste your Vercel URL here

  # ─────────────────────────────────────────────────────────────
  # SERVICE 2: FAISS Vector Service
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: pulseguard-vector
    runtime: docker
    dockerfilePath: ./vector-service/Dockerfile
    dockerContext: ./vector-service
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: VECTOR_DATA_DIR
        value: /tmp/faiss
